[package]
name = "hearth-irc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Files for agents. Chat for humans."
license = "WTFPL"
readme = "README.md"
repository = "https://github.com/spiritbuun/hearth-irc"
keywords = ["irc", "fuse", "agents", "chat"]
categories = ["command-line-utilities", "filesystem", "network-programming"]
include = ["src/**", "tests/*.py", "scripts/*.py", "scripts/*.sh", "docs/*.md", "deploy/systemd/*.service", "skills/*/SKILL.md", "README.md", "Cargo.toml", "Cargo.lock", "LICENSE*"]
publish = false
default-run = "hearthd"

[[bin]]
name = "hearthd"
path = "src/main.rs"

[[bin]]
name = "hearth-ircd"
path = "src/bin/hearth-ircd.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
env_logger = "0.11"
fuser = "0.18"
libc = "0.2"
log = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
subtle = "2"
ring = "0.17"
