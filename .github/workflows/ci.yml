name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  minimum-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check --locked --all-targets

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: FUSE prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          if [ ! -e /dev/fuse ]; then sudo modprobe fuse; fi
          test -r /dev/fuse
          test -w /dev/fuse
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 tests/install.py
      - run: python3 tests/ircd.py
      - run: python3 tests/mounted.py
      - run: python3 tests/remote.py
      - name: Validate user service unit
        run: |
          sh scripts/install.sh --prefix "$HOME/.local" --bin-dir target/debug
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/hearth-runtime"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          systemd-analyze --user verify deploy/systemd/hearth-ircd.service
